<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elisabeth Jarland</title>
  <style>
    :root { --bg: #fafaf8; --fg: #1d1d1b; --muted: #6b6b66; --accent: #1f6f8b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161615; --fg: #ecece8; --muted: #a3a39d; --accent: #6cb6d1; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font: 18px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 24px 16px;
    }
    main { max-width: 36rem; }
    h1 { font-size: 2.2rem; line-height: 1.2; margin: 0 0 .5rem; }
    p { margin: 0 0 1rem; color: var(--muted); }
    .bar { width: 48px; height: 4px; background: var(--accent); border-radius: 2px; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <div class="bar"></div>
    <h1>Elisabeth Jarland</h1>
    <p>Velkommen! Denne siden er under oppbygging. Mer innhold kommer snart.</p>
  </main>
</body>
</html>
